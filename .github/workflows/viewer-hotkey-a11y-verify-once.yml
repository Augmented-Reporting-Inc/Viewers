name: Viewer Hotkey Accessibility Verify One-Time

on:
  push:
    branches:
      - ops/a11y-viewer-hotkey-verify-20261015
    paths:
      - ".github/workflows/viewer-hotkey-a11y-verify-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Run focused HotkeysManager tests
        run: yarn jest platform/core/src/classes/HotkeysManager.test.js --runInBand
      - name: Build OHIF core
        run: yarn workspace @ohif/core build
