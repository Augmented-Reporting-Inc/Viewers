name: Viewer Accessibility Build One-Time

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR52 plus accessibility keyboard fixes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Run HotkeysManager regression tests
        run: yarn workspace @ohif/core test:unit:ci --runTestsByPath src/classes/HotkeysManager.test.js --collectCoverage=false

      - name: Build UI package
        run: yarn workspace @ohif/ui-next build

      - name: Build default extension
        run: yarn workspace @ohif/extension-default build

      - name: Build viewer app
        env:
          APP_CONFIG: config/ar.js
          PUBLIC_URL: /
        run: yarn workspace @ohif/app build
