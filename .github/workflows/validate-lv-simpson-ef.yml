name: Validate LV Simpson EF

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact Viewers branch or commit to validate'
        required: true
        default: port/3.11-custom
        type: string
  pull_request:
    branches:
      - port/3.11-custom
    paths:
      - 'extensions/cornerstone/src/utils/lvSimpsonContour.test.ts'
      - 'extensions/cornerstone/src/utils/efPhysicalCalibration.test.ts'
      - 'extensions/cornerstone/src/utils/measurementAnnotationHydration*.ts'
      - 'extensions/cornerstone/src/utils/savedVolumeContourMetadata.ts'
      - 'extensions/cornerstone/src/utils/usRegionLengthCalibration.ts'
      - 'extensions/cornerstone/src/utils/spectralVmaxTargets.test.ts'
      - 'extensions/cornerstone/src/utils/spectralVmaxClick*.ts'
      - 'extensions/cornerstone/src/utils/rvFacContour*.ts'
      - 'extensions/cornerstone/src/utils/ultrasoundDirectionalReportMapping.ts'
      - 'extensions/extension-ar-measurements/src/utils/rightHeartMeasurements*.ts'
      - 'extensions/extension-ar-measurements/src/utils/echoAreaMeasurements*.ts'
      - 'extensions/extension-ar-measurements/src/utils/laVolume.ts'
      - 'extensions/extension-ar-measurements/src/utils/laBiplaneDisks.test.ts'
      - 'extensions/extension-ar-measurements/src/utils/viewerRightHeartQuizComposite.test.ts'
      - 'modes/longitudinal/src/toolbarButtons.ts'
      - 'extensions/extension-ar-measurements/src/utils/lvSimpsonReportMapping.test.ts'
      - 'extensions/cornerstone/src/utils/measurementServiceMappings/SplineROI.ts'
      - 'extensions/extension-ar-measurements/src/utils/lvSimpson.ts'
      - 'extensions/extension-ar-measurements/src/panels/ARMeasurementsPanel.tsx'
      - 'extensions/cornerstone/src/commandsModule.ts'
      - '.github/workflows/validate-lv-simpson-ef.yml'

permissions:
  contents: read

jobs:
  ef-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Viewers source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Install exact locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test calibrated EF dual capture and save/reopen invariants
        run: yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/cornerstone/src/utils/efPhysicalCalibration.test.ts extensions/cornerstone/src/utils/measurementAnnotationHydration.ef.test.ts
      - name: Test guided LV EF contour geometry
        run: yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/cornerstone/src/utils/lvSimpsonContour.test.ts
      - name: Test editable annulus/apex RV contour geometry
        run: yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/cornerstone/src/utils/rvFacContour.test.ts
      - name: Test calibrated spectral Vmax and single-click reference baseline
        run: yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/cornerstone/src/utils/spectralVmaxTargets.test.ts extensions/cornerstone/src/utils/spectralVmaxClick.test.ts
      - name: Test right-heart calculations and clinical EF mapping
        run: yarn jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/extension-ar-measurements/src/utils/rightHeartMeasurements.test.ts extensions/extension-ar-measurements/src/utils/lvSimpsonReportMapping.test.ts extensions/extension-ar-measurements/src/utils/echoAreaMeasurements.test.ts extensions/extension-ar-measurements/src/utils/laBiplaneDisks.test.ts extensions/extension-ar-measurements/src/utils/viewerRightHeartQuizComposite.test.ts
      - name: Test EF quiz composite integration
        run: yarn jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --coverage=false --runTestsByPath extensions/extension-ar-measurements/src/utils/viewerQuizCompositeResults.test.ts
