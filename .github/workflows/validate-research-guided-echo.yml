name: Validate guided Echo Research workflows

on:
  pull_request:
    branches:
      - fix/research-ivc-navigation-shared-length-display-20261117
      - fix/research-ivc-redraw-single-source-controls-20261117
      - fix/research-ivc-values-panel-dedupe-20261117
      - fix/research-ivc-phase-navigation-20261117
      - feature/research-frame-picker-20261116
      - feature/research-ivc-rap-rvsp-group-20261116
      - feature/research-guided-echo-measurements-20261116
      - feature/research-quiz-style-read-20261116
      - port/3.11-custom
    paths:
      - 'extensions/extension-ar-research/src/**'
      - 'extensions/cornerstone/src/commandsModule.ts'
      - 'extensions/cornerstone/src/initCornerstoneTools.js'
      - 'extensions/cornerstone/src/utils/**'
      - '.github/workflows/validate-research-guided-echo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Test Research Read workflows, binding, target sources and RAP
        run: |
          yarn jest --config extensions/extension-ar-research/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/extension-ar-research/src/utils/readSchemaCalculated.test.ts \
            extensions/extension-ar-research/src/utils/researchFieldNavigation.test.ts \
            extensions/extension-ar-research/src/utils/researchEchoWorkflow.test.ts \
            extensions/extension-ar-research/src/utils/researchFramePicker.test.ts \
            extensions/extension-ar-research/src/utils/researchCaseFrameTargets.test.ts
      - name: Compile Research panels and shared Length registration
        run: |
          node - <<'NODE'
          const babel = require('@babel/core');
          const files = [
            'extensions/extension-ar-research/src/panels/ResearchReadPanel.tsx',
            'extensions/extension-ar-research/src/panels/ResearchEchoGuidedControls.tsx',
            'extensions/cornerstone/src/commandsModule.ts',
            'extensions/cornerstone/src/initCornerstoneTools.js',
            'extensions/cornerstone/src/utils/createCalibratedLengthTextLines.ts',
            'extensions/cornerstone/src/utils/measurementServiceMappings/Length.ts',
          ];
          for (const file of files) {
            const result = babel.transformFileSync(file, { envName: 'production' });
            if (!result?.code) throw new Error('Could not compile ' + file);
            console.log('Compiled', file);
          }
          NODE

      - name: Validate PR 156 edited LV Simpson physical recalibration and contour safety
        # This targets the modified EF logic. The separate legacy saved-contour
        # hydration suite currently has 4 pre-existing failures on PR #156 too
        # (LA/RV saved overlay mock expectations); do not conflate it with
        # these changes or silently rewrite unrelated hydration behavior.
        run: |
          yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/cornerstone/src/utils/efPhysicalCalibration.test.ts \
            extensions/cornerstone/src/utils/lvSimpsonContour.test.ts
      - name: Validate EF report compatibility after incorporating PR 156
        run: |
          yarn jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/extension-ar-measurements/src/utils/lvSimpsonReportMapping.test.ts

      - name: Validate Samsung ultrasound Length calibration and restoration (#150)
        run: |
          yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/cornerstone/src/utils/exactViewerQuizSopFrame.test.ts \
            extensions/cornerstone/src/utils/usRegionLengthCalibration.test.ts \
            extensions/cornerstone/src/utils/correctUSRegionLength.test.ts \
            extensions/cornerstone/src/utils/createCalibratedLengthTextLines.test.ts
