name: Validate guided Echo Research workflows

on:
  pull_request:
    branches:
      - fix/research-live-length-source-reconciliation-20261117
      - fix/research-ivc-navigation-shared-length-display-20261117
      - fix/research-ivc-redraw-single-source-controls-20261117
      - fix/research-ivc-values-panel-dedupe-20261117
      - fix/research-ivc-phase-navigation-20261117
      - feature/research-frame-picker-20261116
      - feature/research-ivc-rap-rvsp-group-20261116
      - feature/research-guided-echo-measurements-20261116
      - feature/research-quiz-style-read-20261116
      - port/3.11-custom
      - AR-1106-shared-echo-ef-question-volume
      - fix/research-ef-contour-capture-and-length-20261123
      - refactor/shared-learning-research-question-panel-20261123
      - refactor/shared-assessment-research-navigation-20261123
      - refactor/shared-ef-question-answer-20261124
      - fix/research-ef-cine-pause-and-capture-diagnostics-20261124
      - fix/shared-ef-research-capture-restoration-20261124
    paths:
      - 'extensions/extension-ar-research/src/**'
      - 'extensions/extension-ar-measurements/src/**'
      - 'extensions/extension-ar-learning/src/panels/CaseQuestionsPanel.tsx'
      - 'extensions/cornerstone/src/commandsModule.ts'
      - 'extensions/cornerstone/src/initCornerstoneTools.js'
      - 'extensions/cornerstone/src/utils/**'
      - '.github/workflows/validate-research-guided-echo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Verify cine pause and exact-frame EF navigation
        run: node --test modes/mode-ar-learning/tests/ef-guided-cine-pause.test.cjs
      - name: Test Research Read workflows, binding, target sources and RAP
        run: |
          yarn jest --config extensions/extension-ar-research/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/extension-ar-research/src/utils/readSchemaCalculated.test.ts \
            extensions/extension-ar-research/src/utils/researchFieldNavigation.test.ts \
            extensions/extension-ar-research/src/utils/researchEchoWorkflow.test.ts \
            extensions/extension-ar-research/src/utils/researchEchoAnswerBinding.test.ts \
            extensions/extension-ar-research/src/utils/researchMeasurementTool.test.ts \
            extensions/extension-ar-research/src/utils/researchEchoCaptureWiring.test.ts \
            extensions/extension-ar-research/src/utils/researchFramePicker.test.ts \
            extensions/extension-ar-research/src/utils/researchCaseFrameTargets.test.ts
      - name: Test shared EF contour presentation
        run: |
          yarn jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/extension-ar-measurements/src/components/EchoEFContourVolumes.test.ts \
            extensions/extension-ar-measurements/src/components/EchoCompositeResultStatus.test.ts \
            extensions/extension-ar-measurements/src/utils/echoCompositeAcquisition.test.ts \
            extensions/extension-ar-measurements/src/components/EchoContourTechniqueButtons.test.ts \
            extensions/extension-ar-measurements/src/components/SharedQuestionPanel.test.tsx \
            extensions/extension-ar-measurements/src/components/SharedQuestionPanelWiring.test.ts \
            extensions/extension-ar-learning/src/panels/LearningQuestionPanel.test.tsx \
            extensions/extension-ar-learning/src/components/LearningSingleChoiceAnswer.test.tsx
      - name: Compile Research panels and shared Length registration
        run: |
          node - <<'NODE'
          const babel = require('@babel/core');
          const files = [
            'extensions/extension-ar-research/src/panels/ResearchReadPanel.tsx',
            'extensions/extension-ar-research/src/utils/researchEchoAnswerBinding.ts',
            'extensions/extension-ar-measurements/src/components/EchoEFContourVolumes.tsx',
            'extensions/extension-ar-measurements/src/components/EchoCompositeResultStatus.tsx',
            'extensions/extension-ar-measurements/src/components/EchoContourTechniqueButtons.tsx',
            'extensions/extension-ar-measurements/src/components/SharedQuestionNavigation.tsx',
            'extensions/extension-ar-measurements/src/components/SharedMeasurementValueInput.tsx',
            'extensions/extension-ar-measurements/src/components/SharedQuestionCard.tsx',
            'extensions/extension-ar-learning/src/panels/LearningQuestionPanel.tsx',
            'extensions/extension-ar-learning/src/components/LearningEchoAcquisitionControls.tsx',
            'extensions/extension-ar-learning/src/components/LearningEFPanelLauncher.tsx',
            'extensions/extension-ar-learning/src/components/SharedEFQuestionAnswer.tsx',
            'extensions/extension-ar-learning/src/components/LearningSingleChoiceAnswer.tsx',
            'extensions/extension-ar-measurements/src/utils/echoCompositeAcquisition.ts',
            'extensions/extension-ar-learning/src/panels/CaseQuestionsPanel.tsx',
            'extensions/extension-ar-research/src/panels/ResearchEchoGuidedControls.tsx',
            'extensions/cornerstone/src/commandsModule.ts',
            'extensions/cornerstone/src/initCornerstoneTools.js',
            'extensions/cornerstone/src/utils/createCalibratedLengthTextLines.ts',
            'extensions/cornerstone/src/utils/measurementServiceMappings/Length.ts',
          ];
          for (const file of files) {
            const result = babel.transformFileSync(file, { envName: 'production' });
            if (!result?.code) throw new Error('Could not compile ' + file);
            console.log('Compiled', file);
          }
          NODE

      - name: Build Research extension without deploying
        run: yarn --cwd extensions/extension-ar-research build

      - name: Validate PR 156 edited LV Simpson physical recalibration and contour safety
        # This targets the modified EF logic. The separate legacy saved-contour
        # hydration suite currently has 4 pre-existing failures on PR #156 too
        # (LA/RV saved overlay mock expectations); do not conflate it with
        # these changes or silently rewrite unrelated hydration behavior.
        run: |
          yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/cornerstone/src/utils/efPhysicalCalibration.test.ts \
            extensions/cornerstone/src/utils/lvSimpsonContour.test.ts \
            extensions/cornerstone/src/utils/savedLVSimpsonRestoration.test.ts
      - name: Validate EF report compatibility after incorporating PR 156
        run: |
          yarn jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/extension-ar-measurements/src/utils/lvSimpsonReportMapping.test.ts

      - name: Validate Samsung ultrasound Length calibration and restoration (#150)
        run: |
          yarn jest --config extensions/cornerstone/jest.config.js --runInBand --coverage=false --runTestsByPath \
            extensions/cornerstone/src/utils/exactViewerQuizSopFrame.test.ts \
            extensions/cornerstone/src/utils/usRegionLengthCalibration.test.ts \
            extensions/cornerstone/src/utils/correctUSRegionLength.test.ts \
            extensions/cornerstone/src/utils/createCalibratedLengthTextLines.test.ts
