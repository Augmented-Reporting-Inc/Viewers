name: AR Learning Extension Validation

on:
  push:
    branches:
      - feature/timed-learner-viewer-persistence-20261025
      - fix/ef-progress-quiz-capture-parity-20261020
      - fix/ef-stable-panel-refresh-20261022
      - fix/ef-sticky-tool-between-contours-20261020
      - feat/lv-ef-rounded-contour-20261021
      - feat/quiz-ef-la-auto-activate-capture-20261021
      - feature/ef-authored-contour-frame-navigation-20261024
      - fix/ef-panel-contour-actions-20261025
  pull_request:
    branches:
      - fix/ef-sticky-tool-between-contours-20261020
      - feat/lv-ef-rounded-contour-20261021
      - port/3.11-custom
      - integration/ef-progress-current
      - integration/quiz-wcag-length-20261013
      - feature/ef-explicit-calculate-20261023
    paths:
      - 'extensions/extension-ar-learning/**'
      - 'extensions/cornerstone/src/commandsModule.ts'
      - 'extensions/extension-ar-measurements/**'
      - 'extensions/cornerstone/src/utils/lvSimpsonContour.ts'
      - 'extensions/cornerstone/src/utils/lvSimpsonContour.test.ts'
      - 'extensions/cornerstone/src/utils/measurementAnnotationHydration.ts'
      - 'extensions/cornerstone/src/utils/measurementServiceMappings/PlanarFreehandROI.ts'
      - 'modes/mode-ar-learning/**'
      - 'modes/longitudinal/src/toolbarButtons.ts'
      - '.github/workflows/ar-learning-pr-validation.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'Dockerfile rviewer'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar-learning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ar-learning:
    name: Build AR learning extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check learning toolbar domain and read-only contracts
        run: node --test modes/mode-ar-learning/tests/toolbar-visibility.test.cjs
      - name: Validate EF panel and quiz capture parity
        run: npx jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --runTestsByPath extensions/extension-ar-measurements/src/utils/viewerQuizCompositeResults.test.ts
      - name: Validate timed viewer autosave debounce, retry and save serialization
        run: npx jest --config extensions/extension-ar-measurements/jest.config.js --runInBand --runTestsByPath extensions/extension-ar-measurements/src/utils/timedViewerAutosave.test.ts
      - name: Validate guided EF mouse ownership and tool restoration
        run: npx jest --config extensions/cornerstone/jest.config.js --runInBand --runTestsByPath extensions/cornerstone/src/utils/guidedMouseToolOwnership.test.ts
      - name: Validate LV EF initial contour landmarks and calculator compatibility
        run: npx jest --config extensions/cornerstone/jest.config.js --runInBand --runTestsByPath extensions/cornerstone/src/utils/lvSimpsonContour.test.ts
      - name: Validate timed learner viewer attempt persistence identity
        run: npx jest --config extensions/cornerstone/jest.config.js --runInBand --runTestsByPath extensions/cornerstone/src/utils/timedLearnerViewerTarget.test.ts
      - name: Validate quiz composite activation and study-scoped capture intent
        run: npx jest --config extensions/extension-ar-learning/jest.config.js --runInBand --runTestsByPath extensions/extension-ar-learning/src/utils/quizCompositeCaptureIntent.test.ts
      - name: Compile AR learning extension
        # Standalone workspace bundles lack react-dom peer resolution on this
        # EF candidate path; the complete production Docker build below
        # validates all bundled code. Retain historical PR checks unchanged.
        if: github.event_name == 'pull_request' && github.head_ref != 'feat/lv-ef-rounded-contour-20261021' && github.head_ref != 'feat/quiz-ef-la-auto-activate-capture-20261021'
        run: yarn workspace extension-ar-learning build
      - name: Compile AR learning mode
        # Standalone workspace bundles lack react-dom peer resolution on this
        # EF candidate path; the complete production Docker build below
        # validates all bundled code. Retain historical PR checks unchanged.
        if: github.event_name == 'pull_request' && github.head_ref != 'feat/lv-ef-rounded-contour-20261021' && github.head_ref != 'feat/quiz-ef-la-auto-activate-capture-20261021'
        run: yarn workspace mode-ar-learning build
      - name: Compile Cornerstone extension for Length Escape changes
        # Standalone workspace bundles lack react-dom peer resolution on this
        # EF candidate path; the complete production Docker build below
        # validates all bundled code. Retain historical PR checks unchanged.
        if: github.event_name == 'pull_request' && github.head_ref != 'feat/lv-ef-rounded-contour-20261021' && github.head_ref != 'feat/quiz-ef-la-auto-activate-capture-20261021'
        run: yarn workspace @ohif/extension-cornerstone build

  validate-rviewer-image-assets:
    name: Validate production Viewer asset paths
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build production Viewer image with /rviewer/ public URL
        run: |
          docker build --platform linux/amd64 -f "Dockerfile rviewer" \
            --build-arg APP_CONFIG=config/default.js \
            --build-arg PUBLIC_URL=/rviewer/ \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" \
            -t ar-rviewer:asset-check .
      - name: Reject incorrect or missing production assets
        run: |
          container_id=$(docker create ar-rviewer:asset-check)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/usr/share/nginx/html/index.html" ./rviewer-build-index.html
          docker cp "$container_id:/usr/share/nginx/html/app-config.js.gz" ./rviewer-build-app-config.js.gz
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('rviewer-build-index.html', 'utf8');
          assert.match(html, /window\.PUBLIC_URL\s*=\s*['"]\/rviewer\/['"]/);
          for (const path of ['app-config.js', 'init-service-worker.js', 'app.bundle.css']) {
            assert.ok(html.includes('/rviewer/' + path), 'Missing /rviewer/' + path);
            assert.ok(!html.includes('"/' + path), 'Root-relative asset reference: /' + path);
          }
          assert.match(html, /src=['"]\/rviewer\/app\.bundle\.[^'"]+\.js['"]/);
          assert.ok(fs.statSync('rviewer-build-app-config.js.gz').size > 0, 'Bundled compressed app-config.js is missing or empty');
          console.log('Production /rviewer/ asset paths and bundled app-config.js verified');
          NODE
