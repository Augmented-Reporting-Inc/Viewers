name: Viewer Accessibility Side Panel Build One-Time

on:
  push:
    branches:
      - ops/a11y-side-panel-build-once-20261022
    paths:
      - ".github/workflows/viewer-accessibility-side-panel-build-once.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build viewer side-panel accessibility fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build UI package
        run: yarn workspace @ohif/ui-next build

      - name: Build default extension
        run: yarn workspace @ohif/extension-default build

      - name: Build viewer app
        env:
          APP_CONFIG: config/ar.js
          PUBLIC_URL: /
        run: yarn workspace @ohif/app build
